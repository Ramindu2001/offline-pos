# ---------------------------------------------------------------------------
# OfflinePOS - bundled default settings
#
# These ship inside the jar and are the same for every install. To change a
# setting on one machine, do NOT edit this file: create an override at
#
#     %APPDATA%\OfflinePOS\offlinepos.properties
#
# and put only the keys you are changing in it. That file wins over this one,
# survives an upgrade, and keeps shop credentials out of the build.
# ---------------------------------------------------------------------------

app.name=OfflinePOS
app.version=1.0-SNAPSHOT
app.devMode=false

# ---------------------------------------------------------------------------
# Database
#
# The password is deliberately blank here. A real one belongs in the override
# file, never in the repository.
# ---------------------------------------------------------------------------

# Port 3307 is the MySQL 8 instance. Note that XAMPP's MariaDB sits on the
# usual 3306 on developer machines and is NOT the target: it holds the legacy
# democloud database, and MariaDB 10.4 accepts SQL that MySQL 8 rejects.
db.host=localhost
db.port=3307
db.name=offline_pos
db.user=root
db.password=
db.pool.size=8
db.timezone=Asia/Colombo
